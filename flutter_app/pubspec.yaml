name: warqna_mobile
publish_to: none
description: Warqnaa premium social card games app for Android, iOS and Web.
version: 1.9.0+700

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  lottie: ^3.3.3
  google_mobile_ads: 7.0.0
  flutter_webrtc: 1.4.0
  permission_handler: ^12.0.3
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.0.1
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # R10 keeps the initial install lean: only core brand/Pasha, compact boosters,
    # optimized WebP derivatives and compressed OGG sound cues are bundled.
    # Historical source artwork remains in the repository but is not packaged.
    - assets/images/brand/warqna_logo.png
    - assets/images/pasha.png
    - assets/images/boosters/v183/
    # Flutter directory declarations are not recursive; include each leaf.
    - assets/optimized/r10/
    - assets/optimized/r10/cardbacks/v021/
    - assets/optimized/r10/games/
    - assets/optimized/r10/pasha/v173/
    - assets/optimized/r10/tables/reference/
    - assets/optimized/r10/tables/v173/royal/
    - assets/optimized/r10/tables/v173/showcase/
    - assets/optimized/r10/v02/rewards/
    - assets/optimized/r10/v02/tickets/
    - assets/optimized/r101/
    - assets/optimized/r101/games/
    - assets/sounds/r10/
    - assets/lottie/world/
