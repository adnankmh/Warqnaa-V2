name: WORLD EXPERIENCE Global Release Gate

on:
  workflow_dispatch:
  push:
    tags: ['v1.*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          tools: composer:v2
      - run: python3 tools/validate_release.py
      - run: python3 tools/test_v260_r14_contract.py
      - run: python3 tools/test_v263_r14_3_contract.py
          python3 tools/test_v300_world_experience_contract.py
      - run: python3 tools/global_release_preflight.py --report "$RUNNER_TEMP/global-release.json"
      - name: Engine Gold release evidence
        env:
          WARQNA_GOLD_MATCHES_PER_ENGINE: 2000
          WARQNA_GOLD_MAX_TRANSITIONS: 320
          WARQNA_GOLD_REPORT: ${{ runner.temp }}/engine-gold.json
        run: php backend-laravel/tools/test-v250-r13-engine-gold.php
      - name: Laravel production suite
        working-directory: backend-laravel
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          php artisan test
          php artisan warqna:global-release-check --json
      - uses: actions/upload-artifact@v6
        with:
          name: r14-foundation-evidence
          path: |
            ${{ runner.temp }}/global-release.json
            ${{ runner.temp }}/engine-gold.json

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"
      - name: Build production backend image
        working-directory: backend-laravel
        run: docker build -t warqnaa-api:${{ steps.release.outputs.version }} .

  android-web:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Generate Android and resolve packages
        working-directory: flutter_app
        run: |
          flutter create . --platforms=android --project-name warqna_mobile --org com.warqna --no-pub
          flutter pub get
      - name: Analyze and test
        working-directory: flutter_app
        run: flutter analyze && flutter test
      - name: Build appbundle and web
        working-directory: flutter_app
        run: |
          flutter build appbundle --release --build-name=${{ steps.release.outputs.version }} --build-number=${{ steps.release.outputs.build }}
          flutter build web --release --dart-define=WARQNA_APP_VERSION=${{ steps.release.outputs.version }} --dart-define=WARQNA_APP_BUILD=${{ steps.release.outputs.build }}
      - uses: actions/upload-artifact@v6
        with:
          name: r14-android-web-unsigned
          path: |
            flutter_app/build/app/outputs/bundle/release/*.aab
            flutter_app/build/web

  ios:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Generate iOS and resolve packages
        working-directory: flutter_app
        run: |
          flutter create . --platforms=ios --project-name warqna_mobile --org com.warqna --no-pub
          flutter pub get
      - name: Build unsigned iOS
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign --build-name=${{ steps.release.outputs.version }} --build-number=${{ steps.release.outputs.build }}

  release-evidence:
    needs: [foundation, backend-image, android-web, ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"
      - name: Require every global channel
        run: |
          test "${{ needs.foundation.result }}" = success
          test "${{ needs.backend-image.result }}" = success
          test "${{ needs.android-web.result }}" = success
          test "${{ needs.ios.result }}" = success
      - name: Write global release evidence
        run: |
          printf '%s\n' "Warqnaa ${{ steps.release.outputs.full }} WORLD EXPERIENCE: all four channel gates passed." > global-release-evidence.txt
          sha256sum global-release-evidence.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: warqnaa-world-${{ steps.release.outputs.build }}-global-release-evidence
          path: |
            global-release-evidence.txt
            SHA256SUMS.txt
