name: Build and deploy Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The build must always work even when GitHub Pages has not been enabled for the repository.
# Deployment is detected automatically and only runs for repositories with an existing Pages site.
permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect whether GitHub Pages is already enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          set -e
          if [ "$HTTP_CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; this run will also prepare a Pages deployment."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled or not readable (HTTP $HTTP_CODE)."
            echo "The Flutter Web build will still succeed and be uploaded as a normal Actions artifact."
          fi

      - name: Load release metadata
        id: release
        run: python3 tools/release_metadata.py --github-output >> "$GITHUB_OUTPUT"

      - name: Validate source package and reject merge markers
        run: python3 tools/validate_release.py

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Get Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Verify additive release contracts
        working-directory: flutter_app
        run: |
          python3 ../tools/test_v171_controller_references.py
          python3 ../tools/test_v172_brand_table_contract.py
          python3 ../tools/test_v173_online_engagement_contract.py
          python3 ../tools/test_v181_ci_regression_contract.py
          python3 ../tools/test_v182_rewards_contract.py
          python3 ../tools/test_ci_release_compat_contract.py
          python3 ../tools/test_v183_overhaul_contract.py
          python3 ../tools/test_v200_full_fusion_contract.py
          python3 ../tools/test_v201_gameplay_admin_contract.py
          python3 ../tools/test_v201_r4_hotfix_contract.py
          python3 ../tools/test_v201_r5_ci_stability_contract.py
          python3 ../tools/test_v208_r8_contract.py
          python3 ../tools/test_v209_r9_contract.py
          python3 ../tools/test_v210_r9_1_contract.py
          python3 ../tools/test_v220_r10_contract.py
          python3 ../tools/test_v221_r101_contract.py
          python3 ../tools/test_v230_r11_contract.py
          python3 ../tools/test_v240_r12_contract.py
          python3 ../tools/test_v240_competitive_engines.py
          python3 ../tools/test_v240_php_structure.py
          python3 ../tools/test_v250_r13_contract.py
          python3 ../tools/test_v260_r14_contract.py
          python3 ../tools/test_v263_r14_3_contract.py
          python3 ../tools/global_release_preflight.py
          python3 ../tools/test_v184_flutter_quality_contract.py
          python3 ../tools/test_v184_official_game_rules_contract.py
          python3 ../tools/test_v174_offline_progression_navigation_contract.py
          python3 ../tools/test_v175_xp_challenges_pasha_designer_contract.py
          python3 ../tools/test_v176_daily_pack_inventory_contract.py
          python3 ../tools/test_v030_contract.py
          python3 ../tools/validate_v030_static.py
          python3 ../tools/test_v02_daily_prize_boxes_contract.py

      - name: Verify Flutter API compatibility contract
        working-directory: flutter_app
        run: |
          python3 ../tools/test_flutter_ci_contract.py
          python3 ../tools/test_v170_contract.py

      - name: Analyze Flutter source
        working-directory: flutter_app
        run: bash ../tools/flutter_analyze_ci.sh

      - name: Run engine and widget tests
        working-directory: flutter_app
        run: flutter test

      - name: Build Flutter Web
        working-directory: flutter_app
        env:
          API_URL: ${{ vars.WARQNA_API_URL }}
          PAGES_ENABLED: ${{ steps.pages.outputs.enabled }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          WARQNA_APP_VERSION: ${{ steps.release.outputs.version }}
          WARQNA_APP_BUILD: ${{ steps.release.outputs.build }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          EXTRA_ARGS=("--dart-define=WARQNA_APP_VERSION=$WARQNA_APP_VERSION" "--dart-define=WARQNA_APP_BUILD=$WARQNA_APP_BUILD")
          EXTRA_ARGS+=("--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY" "--dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID" "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
          if [ -n "$API_URL" ]; then
            EXTRA_ARGS+=("--dart-define=WARQNA_API_URL=$API_URL" "--dart-define=WARQNA_PRODUCTION_MODE=true")
          else
            EXTRA_ARGS+=("--dart-define=WARQNA_PRODUCTION_MODE=false")
          fi
          if [ "$PAGES_ENABLED" = "true" ]; then
            BASE_HREF="/$REPOSITORY_NAME/"
          else
            BASE_HREF="/"
          fi
          flutter build web --release --base-href "$BASE_HREF" "${EXTRA_ARGS[@]}"

      - name: Upload Flutter Web build artifact
        uses: actions/upload-artifact@v6
        with:
          name: warqnaa-flutter-web-v${{ steps.release.outputs.build }}
          path: flutter_app/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: flutter_app/build/web

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
