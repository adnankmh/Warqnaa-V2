name: R17 apply staged source patch

on:
  push:
    branches: [codex/r17-content-social-polish]
    paths:
      - 'tools/r17_patch_parts/**'
      - '.github/workflows/r17-apply-staged-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R17 branch
        uses: actions/checkout@v6
        with:
          ref: codex/r17-content-social-polish
          fetch-depth: 0
      - name: Apply staged R17 patch and commit source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/r17_patch_parts/part-* > /tmp/r17.patch.b64
          base64 -d /tmp/r17.patch.b64 > /tmp/r17.patch
          git apply --check /tmp/r17.patch
          git apply /tmp/r17.patch
          rm -rf tools/r17_patch_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(r17): admin presentation, QA roster, bots and reaction polish"
          git push origin HEAD:codex/r17-content-social-polish
