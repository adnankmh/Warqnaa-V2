name: R32 Premium Account Rewards Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r32-premium-account:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R32 premium account rewards contract
        run: python3 tools/test_r32_premium_account_rewards_contract.py
      - name: Preserve R31 premium lobby contract
        run: python3 tools/test_r31_premium_lobby_room_flow_contract.py
      - name: Preserve R30 premium table/avatar contract
        run: python3 tools/test_r30_premium_table_avatar_contract.py
      - name: Preserve R29 premium world contract
        run: python3 tools/test_r29_premium_world_polish_contract.py
      - name: Preserve R28 sky-luxury contract
        run: python3 tools/test_r28_sky_luxury_cross_device_contract.py
      - name: Enforce Android and Web build gates
        run: python3 tools/test_stage_build_workflows.py
      - name: Privacy / no-secrets guard
        run: python3 tools/check_git_privacy_v304.py
      - name: Compile Python contracts
        run: python3 -m compileall -q tools
      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}..HEAD
