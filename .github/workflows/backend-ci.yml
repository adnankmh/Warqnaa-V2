name: Backend CI and Security Foundation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'backend-laravel/**'
      - '.github/workflows/backend-ci.yml'
      - 'tools/**'
      - 'RELEASE_VERSION.json'
  pull_request:
    paths:
      - 'backend-laravel/**'
      - 'tools/**'
      - 'RELEASE_VERSION.json'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-laravel
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_pgsql, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate Composer definition
        run: composer validate --no-check-lock --strict
      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions bootstrap/cache
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
      - name: Verify PHPUnit test suites
        run: |
          test -d tests/Feature
          test -d tests/Unit
          test -f tests/Unit/EnvironmentSanityTest.php
          test -f tests/Unit/ControllerFoundationTest.php
      - name: Verify HTTP controller foundation
        run: php tools/verify_http_foundation.php
      - name: PHP syntax audit
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run standalone V183 engine regressions
        run: php tools/test-v183-engine-overhaul.php
      - name: Run classic game-rule regressions
        run: php tools/test-v142-rule-cores.php
      - name: Verify CI release compatibility
        run: python3 ../tools/test_ci_release_compat_contract.py
      - name: Verify V200 Full Fusion contract
        run: python3 ../tools/test_v200_full_fusion_contract.py
      - name: Verify V201 Gameplay & Admin contract
        run: python3 ../tools/test_v201_gameplay_admin_contract.py
      - name: Verify V201 R4 hotfix and store expansion
        run: python3 ../tools/test_v201_r4_hotfix_contract.py
      - name: Verify V201 R5 CI stability
        run: python3 ../tools/test_v201_r5_ci_stability_contract.py
      - name: Verify R8 engine integrity contract
        run: python3 ../tools/test_v208_r8_contract.py
      - name: Verify R9 visual revolution contract
        run: python3 ../tools/test_v209_r9_contract.py
      - name: Verify R9.1 gameplay polish contract
        run: python3 ../tools/test_v210_r9_1_contract.py
      - name: Verify R10 asset delivery and size contract
        run: python3 ../tools/test_v220_r10_contract.py
      - name: Verify R10.1 commerce and visual contract
        run: python3 ../tools/test_v221_r101_contract.py
      - name: Verify R11 Social World contract
        run: python3 ../tools/test_v230_r11_contract.py
      - name: Verify R12 Competitive Arena contract
        run: python3 ../tools/test_v240_r12_contract.py
      - name: Verify R12 competitive engine integration
        run: python3 ../tools/test_v240_competitive_engines.py
      - name: Verify R12 PHP fallback structure
        run: python3 ../tools/test_v240_php_structure.py
      - name: Verify R13 Engine Gold contract
        run: python3 ../tools/test_v250_r13_contract.py
      - name: Verify R14 Global Release contract
        run: python3 ../tools/test_v260_r14_contract.py
      - name: Verify R14.3 CI Engine Security contract
        run: python3 ../tools/test_v263_r14_3_contract.py
      - name: Verify V300 WORLD EXPERIENCE baseline
        run: python3 ../tools/test_v300_world_experience_contract.py
      - name: Verify V301 CI and six-language stability
        run: python3 ../tools/test_v301_ci_i18n_contract.py
      - name: Verify V302 Flutter and Hand final stability
        run: python3 ../tools/test_v302_flutter_hand_final_contract.py
      - name: Verify R14 cross-channel source readiness
        run: python3 ../tools/global_release_preflight.py
      - name: Run R8 deep Tarneeb Hand Banakil audit
        run: php tools/test-v208-r8-rules.php
      - name: Run V184 official game-rule audit
        run: php tools/test-v184-official-rules-audit.php
      - name: Run R8 multi-step engine playthrough stress
        env:
          WARQNA_PLAYTHROUGH_RUNS: 4
          WARQNA_PLAYTHROUGH_STEPS: 80
        run: php tools/test-v208-r8-playthrough-stress.php
      - name: Stress all registered game engines
        run: php tools/test-v184-engine-stress.php
      - name: Run R13 Engine Gold smoke certification
        env:
          WARQNA_GOLD_MATCHES_PER_ENGINE: 25
          WARQNA_GOLD_MAX_TRANSITIONS: 160
        run: php tools/test-v250-r13-engine-gold.php
      - name: Run R11 privacy, spectator, replay and economy tests
        run: php artisan test --filter V230SocialWorldTest
      - name: Verify R11 Social World retention command
        run: php artisan warqna:cleanup-social-world --dry-run
      - name: Run R12 matchmaking, MMR, bracket and reward tests
        run: php artisan test --filter V240CompetitiveArenaTest
      - name: Run R13 engine certification unit contract
        run: php artisan test --filter V250EngineGoldContractTest
      - name: Run R14 Global Release unit contract
        run: php artisan test --filter V260GlobalReleaseContractTest
      - name: Verify R14 operations readiness command
        run: php artisan warqna:global-release-check --json
      - name: Verify R12 Competitive lifecycle command
        run: php artisan warqna:competitive-tick --dry-run
      - name: Run Laravel tests
        run: php artisan test
      - name: Production preflight in non-strict mode
        run: php artisan warqna:production-check

  docker-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare temporary Compose environment
        working-directory: backend-laravel
        run: |
          cp .env.production.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-placeholder/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-placeholder/' .env
          sed -i 's/^VOICE_TURN_USERNAME=.*/VOICE_TURN_USERNAME=ci-placeholder/' .env
          sed -i 's/^VOICE_TURN_CREDENTIAL=.*/VOICE_TURN_CREDENTIAL=ci-placeholder/' .env
      - name: Validate production Compose
        working-directory: backend-laravel
        run: docker compose -f docker-compose.production.yml config >/dev/null
      - name: Build production image
        working-directory: backend-laravel
        run: docker build -t warqna-api:ci .
      - name: Remove temporary Compose environment
        if: always()
        working-directory: backend-laravel
        run: rm -f .env
