name: R22 Multiplayer Resilience Gate
on:
  workflow_dispatch:
  push:
    branches: ['codex/r22-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: r22-multiplayer-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  resilience-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verify cumulative authority and resilience contracts
        run: |
          python3 tools/test_r22_multiplayer_resilience_contract.py
          python3 tools/test_r21_community_contract.py
          python3 tools/test_r20_premium_experience_contract.py
          python3 tools/check_git_privacy_v304.py
      - name: Verify workflow and repository syntax
        run: |
          python3 -m py_compile tools/test_r22_multiplayer_resilience_contract.py
          git diff --check HEAD^
