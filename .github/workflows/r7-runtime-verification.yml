name: R7 isolated runtime and visual review
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: r7-runtime-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install locked backend dependencies
        working-directory: backend-laravel
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel writable directories
        run: mkdir -p backend-laravel/storage/framework/{views,cache/data,sessions} backend-laravel/bootstrap/cache
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Exercise live HTTP journeys and render Flutter review screens
        run: python3 tools/r7_runtime_smoke.py --flutter-review --report-dir "$RUNNER_TEMP/r7-review"
      - name: Upload sanitized results and synthetic-account screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: warqnaa-r7-runtime-review
          path: ${{ runner.temp }}/r7-review
          if-no-files-found: warn
          retention-days: 14
      - name: Package committed source and staged installer
        run: python3 tools/package_release.py --output-dir "$RUNNER_TEMP/r7-delivery"
      - name: Upload full source delivery
        uses: actions/upload-artifact@v6
        with:
          name: warqnaa-r7-full-source
          path: ${{ runner.temp }}/r7-delivery
          if-no-files-found: error
          retention-days: 14

  # Independent preserved reference/UX gates. Reusable workflows execute inside
  # this single parent PR run, preserving every existing child job and artifact.
  reference-01:
    uses: ./.github/workflows/r20-premium-experience.yml
    permissions:
      contents: read
  reference-02:
    uses: ./.github/workflows/r21-community.yml
    permissions:
      contents: read
  reference-03:
    uses: ./.github/workflows/r28-sky-luxury-cross-device.yml
    permissions:
      contents: read
  reference-04:
    uses: ./.github/workflows/r29-premium-world-polish.yml
    permissions:
      contents: read
  reference-05:
    uses: ./.github/workflows/r30-premium-table-avatars-reactions.yml
    permissions:
      contents: read
  reference-06:
    uses: ./.github/workflows/r31-premium-lobby-room-flow.yml
    permissions:
      contents: read
  reference-07:
    uses: ./.github/workflows/r32-premium-account-rewards.yml
    permissions:
      contents: read
  reference-08:
    uses: ./.github/workflows/r35-reference-world.yml
    permissions:
      contents: read
